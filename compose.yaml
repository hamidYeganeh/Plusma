services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plusma
      POSTGRES_USER: plusma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - plusma-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plusma -d plusma"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  plusma-postgres:
